name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15+; Node 24's bundled npm may be older.
      - run: npm install -g npm@^11.15.0
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun run check
      # Stages the release; a maintainer approves it on npm with 2FA before it goes live.
      - run: npm stage publish --provenance --access public
